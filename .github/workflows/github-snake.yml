name: Generate Demon Slayer Contribution Snake 🐍

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at midnight
  workflow_dispatch:       # manual trigger from Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Adarsh-tiwari1223
          outputs: |
            dist/github-snake.svg?palette=github-dark
            dist/github-snake-demonslayer.svg?color_snake=#00ff88&color_dots=#121820,#1b4332,#2d6a4f,#40916c,#52b788,#00ff88

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
