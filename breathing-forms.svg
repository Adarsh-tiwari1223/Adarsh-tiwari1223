<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Breath of the SDET — Four Core Testing Forms">
  <title>Breath of the SDET — Four Core Testing Forms</title>
  <defs>
    <style>
      @keyframes pulseWater {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.5)); }
        50% { filter: drop-shadow(0 0 16px rgba(79, 172, 254, 0.8)); }
      }
      @keyframes pulseThunder {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 204, 0, 0.5)); }
        50% { filter: drop-shadow(0 0 16px rgba(255, 153, 0, 0.8)); }
      }
      @keyframes pulseStone {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(46, 204, 113, 0.5)); }
        50% { filter: drop-shadow(0 0 16px rgba(0, 210, 211, 0.8)); }
      }
      @keyframes pulseFlame {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 71, 87, 0.5)); }
        50% { filter: drop-shadow(0 0 16px rgba(255, 107, 129, 0.8)); }
      }
      @keyframes scanBeam {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(300px); opacity: 0; }
      }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-weight: 700; }
      .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
      .water-glow { animation: pulseWater 3s ease-in-out infinite; }
      .thunder-glow { animation: pulseThunder 2.6s ease-in-out infinite 0.5s; }
      .stone-glow { animation: pulseStone 3.2s ease-in-out infinite 1s; }
      .flame-glow { animation: pulseFlame 2.8s ease-in-out infinite 1.5s; }
    </style>

    <pattern id="cardPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#0d1117" opacity="0.6"/>
      <rect x="15" y="0" width="15" height="15" fill="#080b11"/>
      <rect x="0" y="15" width="15" height="15" fill="#080b11"/>
      <rect x="15" y="15" width="15" height="15" fill="#0d1117" opacity="0.6"/>
    </pattern>

    <linearGradient id="bfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10"/>
      <stop offset="50%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Form Gradients -->
    <linearGradient id="gWater" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="gThunder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff9500"/>
    </linearGradient>
    <linearGradient id="gStone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#00d2d3"/>
    </linearGradient>
    <linearGradient id="gFlame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ff6b81"/>
    </linearGradient>

    <clipPath id="bfCardRadius">
      <rect width="1280" height="380" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bfCardRadius)">
    <rect width="1280" height="380" fill="url(#bfBg)"/>
    <rect width="1280" height="380" fill="url(#cardPattern)"/>

    <!-- Section Header -->
    <g transform="translate(60, 42)">
      <rect x="0" y="0" width="36" height="6" rx="3" fill="#ff4757"/>
      <text x="48" y="7" class="font-mono" font-size="11" font-weight="700" fill="#2ecc71" letter-spacing="2">全集中 · TOTAL CONCENTRATION DISCIPLINE</text>
      <text x="0" y="36" class="font-sans" font-size="26" fill="#f8fafc">Breath of the SDET: The 4 Slaying Forms</text>
      <text x="560" y="34" class="font-sub" font-size="13" fill="#64748b">
        "A passing UI does not prove a healthy system — validate every state boundary."
      </text>
    </g>

    <!-- 4 Cards Grid -->
    <g transform="translate(60, 105)">

      <!-- CARD 1: WATER BREATHING (UI AUTOMATION) -->
      <g transform="translate(0, 0)">
        <rect width="270" height="235" rx="16" fill="#101524" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
        <rect width="270" height="4" rx="2" fill="url(#gWater)"/>
        
        <!-- Kanji & Form Name -->
        <g transform="translate(20, 32)">
          <text class="font-mono" font-size="10.5" font-weight="700" fill="#00f2fe" letter-spacing="1.5">壱ノ型 · FORM I</text>
          <text y="22" class="font-sans" font-size="16" fill="#f1f5f9">Water: UI Mastery</text>
          <rect x="180" y="-8" width="48" height="20" rx="6" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="0.8"/>
          <text x="204" y="6" class="font-mono" font-size="9" font-weight="700" fill="#00f2fe" text-anchor="middle">UI E2E</text>
        </g>

        <!-- Weapon & Details -->
        <g transform="translate(20, 85)" class="font-mono" font-size="11">
          <text fill="#64748b">BLADE: <tspan fill="#e2e8f0" font-weight="700">Playwright + PyTest</tspan></text>
          <line x1="0" y1="12" x2="230" y2="12" stroke="#1e293b" stroke-width="1"/>
          
          <g transform="translate(0, 28)" class="font-sub" font-size="12" fill="#94a3b8">
            <text y="0">🌊 Page Object Model (POM)</text>
            <text y="22">🌊 Resilient auto-wait locators</text>
            <text y="44">🌊 Cross-module user flows</text>
            <text y="66">🌊 Zero flaky test tolerance</text>
          </g>
        </g>

        <!-- Bottom Pulse Tag -->
        <g transform="translate(20, 202)">
          <circle cx="5" cy="5" r="3.5" fill="#00f2fe" class="water-glow"/>
          <text x="16" y="9" class="font-mono" font-size="10" fill="#38bdf8">Eliminating visual illusions</text>
        </g>
      </g>

      <!-- CARD 2: THUNDER BREATHING (API CONTRACT TESTING) -->
      <g transform="translate(295, 0)">
        <rect width="270" height="235" rx="16" fill="#101524" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
        <rect width="270" height="4" rx="2" fill="url(#gThunder)"/>
        
        <!-- Kanji & Form Name -->
        <g transform="translate(20, 32)">
          <text class="font-mono" font-size="10.5" font-weight="700" fill="#ffcc00" letter-spacing="1.5">弐ノ型 · FORM II</text>
          <text y="22" class="font-sans" font-size="16" fill="#f1f5f9">Thunder: API Slash</text>
          <rect x="180" y="-8" width="48" height="20" rx="6" fill="#ffcc00" fill-opacity="0.15" stroke="#ffcc00" stroke-width="0.8"/>
          <text x="204" y="6" class="font-mono" font-size="9" font-weight="700" fill="#ffcc00" text-anchor="middle">REST</text>
        </g>

        <!-- Weapon & Details -->
        <g transform="translate(20, 85)" class="font-mono" font-size="11">
          <text fill="#64748b">BLADE: <tspan fill="#e2e8f0" font-weight="700">Requests · Postman</tspan></text>
          <line x1="0" y1="12" x2="230" y2="12" stroke="#1e293b" stroke-width="1"/>
          
          <g transform="translate(0, 28)" class="font-sub" font-size="12" fill="#94a3b8">
            <text y="0">⚡ Sub-millisecond assertions</text>
            <text y="22">⚡ JSON schema &amp; contracts</text>
            <text y="44">⚡ RBAC access boundaries</text>
            <text y="66">⚡ Negative &amp; edge payload RCA</text>
          </g>
        </g>

        <g transform="translate(20, 202)">
          <circle cx="5" cy="5" r="3.5" fill="#ffcc00" class="thunder-glow"/>
          <text x="16" y="9" class="font-mono" font-size="10" fill="#fbbf24">Striking contract anomalies</text>
        </g>
      </g>

      <!-- CARD 3: STONE BREATHING (DATABASE & STATE VALIDATION) -->
      <g transform="translate(590, 0)">
        <rect width="270" height="235" rx="16" fill="#101524" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
        <rect width="270" height="4" rx="2" fill="url(#gStone)"/>
        
        <!-- Kanji & Form Name -->
        <g transform="translate(20, 32)">
          <text class="font-mono" font-size="10.5" font-weight="700" fill="#2ecc71" letter-spacing="1.5">参ノ型 · FORM III</text>
          <text y="22" class="font-sans" font-size="16" fill="#f1f5f9">Stone: DB Integrity</text>
          <rect x="180" y="-8" width="48" height="20" rx="6" fill="#2ecc71" fill-opacity="0.15" stroke="#2ecc71" stroke-width="0.8"/>
          <text x="204" y="6" class="font-mono" font-size="9" font-weight="700" fill="#2ecc71" text-anchor="middle">SQL</text>
        </g>

        <!-- Weapon & Details -->
        <g transform="translate(20, 85)" class="font-mono" font-size="11">
          <text fill="#64748b">BLADE: <tspan fill="#e2e8f0" font-weight="700">SQL · Backend Logic</tspan></text>
          <line x1="0" y1="12" x2="230" y2="12" stroke="#1e293b" stroke-width="1"/>
          
          <g transform="translate(0, 28)" class="font-sub" font-size="12" fill="#94a3b8">
            <text y="0">🪨 Backend persistence audit</text>
            <text y="22">🪨 Idempotency verification</text>
            <text y="44">🪨 Complex state transitions</text>
            <text y="66">🪨 Data consistency checks</text>
          </g>
        </g>

        <g transform="translate(20, 202)">
          <circle cx="5" cy="5" r="3.5" fill="#2ecc71" class="stone-glow"/>
          <text x="16" y="9" class="font-mono" font-size="10" fill="#4ade80">Grounding truth in the database</text>
        </g>
      </g>

      <!-- CARD 4: FLAME BREATHING (CI/CD & DEFECT SLAYING) -->
      <g transform="translate(885, 0)">
        <rect width="270" height="235" rx="16" fill="#101524" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
        <rect width="270" height="4" rx="2" fill="url(#gFlame)"/>
        
        <!-- Kanji & Form Name -->
        <g transform="translate(20, 32)">
          <text class="font-mono" font-size="10.5" font-weight="700" fill="#ff4757" letter-spacing="1.5">肆ノ型 · FORM IV</text>
          <text y="22" class="font-sans" font-size="16" fill="#f1f5f9">Flame: CI/CD Matrix</text>
          <rect x="180" y="-8" width="48" height="20" rx="6" fill="#ff4757" fill-opacity="0.15" stroke="#ff4757" stroke-width="0.8"/>
          <text x="204" y="6" class="font-mono" font-size="9" font-weight="700" fill="#ff4757" text-anchor="middle">CI/CD</text>
        </g>

        <!-- Weapon & Details -->
        <g transform="translate(20, 85)" class="font-mono" font-size="11">
          <text fill="#64748b">BLADE: <tspan fill="#e2e8f0" font-weight="700">GitHub Actions · Docker</tspan></text>
          <line x1="0" y1="12" x2="230" y2="12" stroke="#1e293b" stroke-width="1"/>
          
          <g transform="translate(0, 28)" class="font-sub" font-size="12" fill="#94a3b8">
            <text y="0">🔥 Automated pull request gates</text>
            <text y="22">🔥 Containerized test suites</text>
            <text y="44">🔥 PyTest HTML &amp; Allure traces</text>
            <text y="66">🔥 Root Cause Defect Analysis</text>
          </g>
        </g>

        <g transform="translate(20, 202)">
          <circle cx="5" cy="5" r="3.5" fill="#ff4757" class="flame-glow"/>
          <text x="16" y="9" class="font-mono" font-size="10" fill="#f87171">Burning down flaky regressions</text>
        </g>
      </g>
    </g>

    <!-- Card Border -->
    <rect x="0.75" y="0.75" width="1278.5" height="378.5" rx="23.25" fill="none" stroke="#253046" stroke-width="1.5"/>
  </g>
</svg>
