<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Demon Slayer Slaying Village — 3D Night Skyline">
  <title>Demon Slayer Slaying Village — 3D Night Skyline</title>
  <defs>
    <style>
      @keyframes glowWindow {
        0%, 100% { fill-opacity: 0.8; }
        50% { fill-opacity: 0.3; }
      }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-weight: 700; }
      .window-glow { animation: glowWindow 3s ease-in-out infinite; }
    </style>
    <linearGradient id="cityBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090c14"/>
      <stop offset="60%" stop-color="#0f1624"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ff4757"/>
    </linearGradient>
    <clipPath id="cityRadius">
      <rect width="1280" height="420" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#cityRadius)">
    <rect width="1280" height="420" fill="url(#cityBg)"/>
    
    <!-- Moon / Wisteria Sky -->
    <circle cx="1100" cy="110" r="55" fill="#f1f5f9" fill-opacity="0.9" filter="drop-shadow(0 0 30px rgba(0,242,254,0.4))"/>
    <circle cx="1080" cy="95" r="45" fill="#090c14"/>

    <!-- Stars -->
    <circle cx="120" cy="60" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="280" cy="90" r="2" fill="#2ecc71" opacity="0.7"/>
    <circle cx="450" cy="40" r="1" fill="#ffffff" opacity="0.9"/>
    <circle cx="680" cy="80" r="2" fill="#ffcc00" opacity="0.8"/>
    <circle cx="890" cy="50" r="1.5" fill="#ffffff" opacity="0.6"/>

    <!-- Traditional Pagodas / Slaying District Skyline Silhouette -->
    <!-- Far Background Buildings -->
    <path d="M 60,340 L 120,240 L 180,340 Z" fill="#141a29" opacity="0.7"/>
    <rect x="220" y="200" width="80" height="140" fill="#141a29" opacity="0.7"/>
    <path d="M 210,200 L 260,160 L 310,200 Z" fill="#141a29" opacity="0.7"/>
    <rect x="360" y="170" width="100" height="170" fill="#161f31" opacity="0.7"/>
    <rect x="520" y="220" width="90" height="120" fill="#141a29" opacity="0.7"/>
    <rect x="670" y="150" width="110" height="190" fill="#161f31" opacity="0.7"/>
    <path d="M 650,150 L 725,100 L 800,150 Z" fill="#161f31" opacity="0.7"/>
    <rect x="840" y="210" width="120" height="130" fill="#141a29" opacity="0.7"/>
    <rect x="1020" y="180" width="90" height="160" fill="#161f31" opacity="0.7"/>

    <!-- Foreground Stylized Isometric Blocks (Commit City) -->
    <!-- Block Group 1 -->
    <g transform="translate(140, 270)">
      <polygon points="0,20 40,0 80,20 40,40" fill="#2ecc71"/>
      <polygon points="0,20 40,40 40,90 0,70" fill="#27ae60"/>
      <polygon points="40,40 80,20 80,70 40,90" fill="#1e8449"/>
    </g>
    <!-- Block Group 2 -->
    <g transform="translate(240, 230)">
      <polygon points="0,30 50,0 100,30 50,60" fill="#00f2fe"/>
      <polygon points="0,30 50,60 50,130 0,100" fill="#0984e3"/>
      <polygon points="50,60 100,30 100,100 50,130" fill="#00cec9"/>
    </g>
    <!-- Block Group 3 -->
    <g transform="translate(380, 200)">
      <polygon points="0,40 60,0 120,40 60,80" fill="#ff4757"/>
      <polygon points="0,40 60,80 60,160 0,120" fill="#c0392b"/>
      <polygon points="60,80 120,40 120,120 60,160" fill="#e74c3c"/>
    </g>
    <!-- Block Group 4 -->
    <g transform="translate(560, 240)">
      <polygon points="0,25 45,0 90,25 45,50" fill="#ffcc00"/>
      <polygon points="0,25 45,50 45,120 0,95" fill="#f39c12"/>
      <polygon points="45,50 90,25 90,95 45,120" fill="#d35400"/>
    </g>
    <!-- Block Group 5 -->
    <g transform="translate(710, 190)">
      <polygon points="0,35 55,0 110,35 55,70" fill="#2ecc71"/>
      <polygon points="0,35 55,70 55,170 0,135" fill="#27ae60"/>
      <polygon points="55,70 110,35 110,135 55,170" fill="#1e8449"/>
    </g>
    <!-- Block Group 6 -->
    <g transform="translate(880, 230)">
      <polygon points="0,30 50,0 100,30 50,60" fill="#a29bfe"/>
      <polygon points="0,30 50,60 50,130 0,100" fill="#6c5ce7"/>
      <polygon points="50,60 100,30 100,100 50,130" fill="#574b90"/>
    </g>
    <!-- Block Group 7 -->
    <g transform="translate(1040, 260)">
      <polygon points="0,25 40,0 80,25 40,50" fill="#00d2d3"/>
      <polygon points="0,25 40,50 40,100 0,75" fill="#01a3a4"/>
      <polygon points="40,50 80,25 80,75 40,100" fill="#006266"/>
    </g>

    <!-- Ground Floor -->
    <rect x="0" y="360" width="1280" height="60" fill="#090d16"/>
    <line x1="0" y1="360" x2="1280" y2="360" stroke="#1f293d" stroke-width="2"/>

    <!-- Overlay Banner Text -->
    <g transform="translate(60, 50)">
      <rect width="460" height="54" rx="12" fill="#111726" fill-opacity="0.85" stroke="#253046" stroke-width="1.2"/>
      <circle cx="20" cy="27" r="4.5" fill="#2ecc71">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="22" class="font-mono" font-size="10.5" font-weight="700" fill="#2ecc71" letter-spacing="1.5">🌃 DEMON SLAYER 3D CONTRIBUTION DISTRICT</text>
      <text x="35" y="40" class="font-sub" font-size="12" fill="#94a3b8">
        Every commit forges another structure · Rebuilt automatically each day
      </text>
    </g>

    <rect x="0.75" y="0.75" width="1278.5" height="418.5" rx="19.25" fill="none" stroke="#253046" stroke-width="1.5"/>
  </g>
</svg>
